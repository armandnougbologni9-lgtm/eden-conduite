name: Déploiement GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissions nécessaires pour publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permet un seul déploiement simultané
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code (Checkout)
        uses: actions/checkout@v4

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléversement des fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déploiement officiel en ligne
        id: deployment
        uses: actions/deploy-pages@v4
